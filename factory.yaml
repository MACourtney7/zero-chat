# factory.yaml - Host Project Configuration for Agentic Software Factory
project_name: "zero_chat"
base_branch: "main"
tech_stack: "Rust (WASM wasm32-unknown-unknown & Cloudflare Workers workers-rs) / WebRTC DataChannel / HTML5"

# Automation commands executed by Validator workers in isolated worktrees:
commands:
  build: "cargo check --workspace"
  test: "cargo test --workspace"
  lint: "cargo clippy --workspace --all-targets -- -D warnings"
  format_check: "cargo fmt --all -- --check"
  wasm_client: "cargo build -p zero_client --target wasm32-unknown-unknown"
  wasm_network: "cargo check -p zero_network --target wasm32-unknown-unknown"

# Paths to relevant host project documentation for Architect and Reviewer:
documentation:
  guidelines: "README.md"
  architecture: "openspec/specs/overview.md"

# Pluggable subagent runners for background worker execution in worktrees:
runners:
  implementer: "python3 \"/Users/mattcourtney/Library/CloudStorage/GoogleDrive-mattadam.courtney@gmail.com/My Drive/software_factory/scripts/factory_deepseek_worker.py\" --role implementer --brief '{brief}' --worktree '{worktree}' --report '{report}'"
  reviewer: "python3 \"/Users/mattcourtney/Library/CloudStorage/GoogleDrive-mattadam.courtney@gmail.com/My Drive/software_factory/scripts/factory_deepseek_worker.py\" --role reviewer --brief '{brief}' --worktree '{worktree}' --report '{report}'"

