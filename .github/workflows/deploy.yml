name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install worker-build
        run: cargo install -q worker-build

      - name: Deploy Cloudflare Worker & Durable Object
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'zero_network'
          command: 'deploy'

  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install -q wasm-bindgen-cli

      - name: Build Client WASM
        run: cargo build -p zero_client --release --target wasm32-unknown-unknown

      - name: Assemble Pages Static Bundle
        run: |
          mkdir -p dist/pkg
          wasm-bindgen --target web --out-dir dist/pkg target/wasm32-unknown-unknown/release/zero_client.wasm
          cp zero_client/index.html dist/
          cp zero_client/style.css dist/

      - name: Deploy Client to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: 'pages deploy dist --project-name=zero-chat --branch=main'
