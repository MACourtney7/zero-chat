<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroChat — Serverless Ephemeral P2P Chat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none !important; }
        .btn-action {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border: none;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            white-space: nowrap;
        }
        .btn-action:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }
        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .join-banner {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #bae6fd;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="chat-layout">
            <header class="chat-header glass-panel">
                <div class="header-brand">
                    <span class="brand-icon">0</span>
                    <div class="brand-text">
                        <h1 class="brand-title">ZeroChat</h1>
                        <span class="brand-tagline">Ephemeral P2P</span>
                    </div>
                </div>
                <div class="header-controls">
                    <div id="peer-count" class="peer-count-badge">0 peers</div>
                    <div id="peer-list" class="peer-list"></div>
                    <button id="destroy-session-button" class="btn btn-burn" type="button" title="Instantly wipes all DOM messages and memory">
                        <span>Burn Session</span>
                    </button>
                </div>
            </header>

            <!-- Room Creation / Invite Controls -->
            <section id="invite-section" class="invite-panel glass-panel">
                <div class="invite-input-row" id="room-controls">
                    <button id="btn-create-room" class="btn-action" type="button">✨ Create Private Room</button>
                    <input id="invite-url-input" class="invite-input hidden" type="text" readonly placeholder="Generating invite link..." />
                    <button id="copy-invite-button" class="btn btn-copy btn-icon hidden" type="button" title="Copy Invite Link" aria-label="Copy Invite Link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Dynamic banner when opening an invite URL -->
            <div id="joiner-banner" class="join-banner hidden">
                <span id="joiner-status-text">🔗 Invite detected! Autodropping SDP answer to signaling edge...</span>
            </div>

            <main id="messages-container" class="messages-container"></main>

            <footer class="chat-footer glass-panel">
                <form id="message-form" class="message-form" onsubmit="return false;">
                    <input id="message-input" class="message-input" type="text" placeholder="Type an encrypted message..." autocomplete="off" disabled />
                    <button id="send-button" class="btn btn-send" type="button" disabled>Send</button>
                </form>
            </footer>
        </div>
    </div>

    <script type="module">
        const WORKER_ORIGIN = "https://network.zero-chat.workers.dev";
        const WORKER_WS_ORIGIN = "wss://network.zero-chat.workers.dev";

        // DOM elements
        const inviteSection = document.getElementById("invite-section");
        const peerCountEl = document.getElementById("peer-count");
        const peerListEl = document.getElementById("peer-list");
        const btnCreateRoom = document.getElementById("btn-create-room");
        const inviteInput = document.getElementById("invite-url-input");
        const btnCopyInvite = document.getElementById("copy-invite-button");
        const joinerBanner = document.getElementById("joiner-banner");
        const joinerStatusText = document.getElementById("joiner-status-text");
        const feed = document.getElementById("messages-container");
        const msgInput = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-button");
        const burnBtn = document.getElementById("destroy-session-button");

        // WebRTC Engine (Browser native WebRTC with bundled candidate gathering)
        class ZeroWebRtcEngine {
            constructor() {
                const rtcConfig = {
                    iceServers: [
                        { urls: "stun:stun.cloudflare.com:3478" },
                        { urls: "stun:stun.l.google.com:19302" }
                    ]
                };
                this.pc = new RTCPeerConnection(rtcConfig);
                this.dc = null;
                this.state = "disconnected";
                this.onStateChangeCb = null;
                this.onMessageCb = null;

                this.pc.ondatachannel = (ev) => {
                    this._attachChannel(ev.channel);
                };
            }

            _setState(s) {
                this.state = s;
                if (this.onStateChangeCb) this.onStateChangeCb(s);
            }

            _attachChannel(ch) {
                this.dc = ch;
                ch.onopen = () => this._setState("open");
                ch.onclose = () => this._setState("closed");
                ch.onerror = () => this._setState("closed");
                ch.onmessage = (ev) => {
                    if (this.onMessageCb) this.onMessageCb(ev.data);
                };
            }

            _waitForIceGatheringComplete() {
                if (this.pc.iceGatheringState === "complete") return Promise.resolve();
                return new Promise((resolve) => {
                    const check = () => {
                        if (this.pc.iceGatheringState === "complete") {
                            this.pc.removeEventListener("icegatheringstatechange", check);
                            resolve();
                        }
                    };
                    this.pc.addEventListener("icegatheringstatechange", check);
                    this.pc.addEventListener("icecandidate", (ev) => {
                        if (ev.candidate === null) {
                            this.pc.removeEventListener("icegatheringstatechange", check);
                            resolve();
                        }
                    });
                    setTimeout(resolve, 3000); // 3s fallback limit
                });
            }

            async create_offer() {
                const ch = this.pc.createDataChannel("zero-chat", { ordered: true });
                this._attachChannel(ch);
                this._setState("connecting");
                const offer = await this.pc.createOffer();
                await this.pc.setLocalDescription(offer);
                await this._waitForIceGatheringComplete();
                return this.pc.localDescription.sdp;
            }

            async accept_offer_and_create_answer(offerSdp) {
                this._setState("connecting");
                await this.pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: offerSdp }));
                const answer = await this.pc.createAnswer();
                await this.pc.setLocalDescription(answer);
                await this._waitForIceGatheringComplete();
                return this.pc.localDescription.sdp;
            }

            async apply_answer(answerSdp) {
                await this.pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: answerSdp }));
            }

            send_text(text) {
                if (!this.dc || this.dc.readyState !== "open") {
                    throw new Error("P2P DataChannel not open");
                }
                this.dc.send(text);
            }

            close() {
                if (this.dc) this.dc.close();
                this.pc.close();
                this._setState("closed");
            }
        }

        // URL-Safe Base64
        function utf8ToBase64Url(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        function base64UrlToUtf8(str) {
            let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4) b64 += "=";
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        async function computeHmacSha256Hex(secretBytes, messageStr) {
            const key = await crypto.subtle.importKey(
                "raw",
                secretBytes,
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );
            const signature = await crypto.subtle.sign(
                "HMAC",
                key,
                new TextEncoder().encode(messageStr)
            );
            return Array.from(new Uint8Array(signature))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function updateStatus(status, text) {
            console.debug(`[Status] ${status}: ${text}`);
        }

        function appendMessageBubble(senderName, text, isSelf) {
            const bubble = document.createElement("div");
            bubble.className = `message-bubble ${isSelf ? "message-outgoing" : "message-incoming"}`;

            const header = document.createElement("div");
            header.className = "message-header";
            const sender = document.createElement("span");
            sender.className = "message-sender";
            sender.textContent = senderName;
            const time = document.createElement("span");
            time.className = "message-timestamp";
            const now = new Date();
            time.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            header.appendChild(sender);
            header.appendChild(time);

            const body = document.createElement("div");
            body.className = "message-text";
            body.textContent = text;

            const badge = document.createElement("div");
            badge.className = "security-badge verified";
            badge.textContent = "🔒 ChaCha20-Poly1305 Verified";

            bubble.appendChild(header);
            bubble.appendChild(body);
            bubble.appendChild(badge);

            feed.appendChild(bubble);
            feed.scrollTop = feed.scrollHeight;
        }

        function appendSystemMessage(text) {
            const el = document.createElement("div");
            el.className = "system-message";
            el.textContent = text;
            feed.appendChild(el);
            feed.scrollTop = feed.scrollHeight;
        }

        let engine = null;
        let hostWs = null;
        let isJoining = false;
        let isBurned = false;

        function initEngineListeners() {
            engine.onStateChangeCb = (st) => {
                if (st === "open") {
                    updateStatus("open", "P2P Established");
                    peerCountEl.textContent = "1 peer";
                    peerListEl.innerHTML = `<span class="peer-pill">🟢 P2P Established</span>`;
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                    msgInput.focus();

                    // Sever host WebSocket edge immediately upon DataChannel open (REQ-004.5)
                    if (hostWs) {
                        try { hostWs.close(); } catch (_) {}
                        hostWs = null;
                    }
                    if (joinerBanner) joinerBanner.classList.add("hidden");
                    if (inviteSection) inviteSection.classList.add("hidden");

                    if (isJoining) {
                        appendSystemMessage("Joined room.");
                    } else {
                        appendSystemMessage("Peer joined.");
                    }
                } else if (st === "closed") {
                    updateStatus("closed", "Disconnected");
                    peerCountEl.textContent = "0 peers";
                    peerListEl.innerHTML = "";
                    msgInput.disabled = true;
                    sendBtn.disabled = true;
                    if (!isBurned) {
                        appendSystemMessage("Peer left.");
                    }
                }
            };

            engine.onMessageCb = (text) => {
                appendMessageBubble("Peer", text, false);
            };
        }

        // =========================================================================
        // HOST WORKFLOW: Create room, offer, signaling websocket, and invite link
        // =========================================================================
        async function createRoomAsHost() {
            isBurned = false;
            isJoining = false;
            btnCreateRoom.disabled = true;
            btnCreateRoom.textContent = "Gathering ICE...";
            updateStatus("signaling", "Gathering ICE & creating offer...");

            try {
                engine = new ZeroWebRtcEngine();
                initEngineListeners();

                const offerSdp = await engine.create_offer();

                // Generate random room DO ID and 32-byte host secret
                const doId = "room-" + Math.random().toString(36).slice(2, 10);
                const hostSecretBytes = crypto.getRandomValues(new Uint8Array(32));
                const hostSecretHex = Array.from(hostSecretBytes).map(b => b.toString(16).padStart(2, "0")).join("");

                const inviteUuid = crypto.randomUUID();
                const tokenHex = await computeHmacSha256Hex(hostSecretBytes, inviteUuid);

                const hostPubkey = Array.from(crypto.getRandomValues(new Uint8Array(32)));

                const invitePayload = {
                    do_id: doId,
                    invite_uuid: inviteUuid,
                    token: tokenHex,
                    sdp_offer: { sdp: offerSdp },
                    host_public_key: hostPubkey,
                    guest_private_key: null
                };

                const packedHash = "#payload=" + utf8ToBase64Url(JSON.stringify(invitePayload));
                const inviteUrl = window.location.origin + window.location.pathname + packedHash;

                // Connect host signaling WebSocket
                updateStatus("signaling", "Awaiting peer connection...");
                const wsUrl = `${WORKER_WS_ORIGIN}/host/${doId}?secret=${hostSecretHex}`;
                hostWs = new WebSocket(wsUrl);

                hostWs.onmessage = async (ev) => {
                    try {
                        const drop = JSON.parse(ev.data);
                        if (drop && drop.sdp_answer && drop.sdp_answer.sdp) {
                            updateStatus("connecting", "Received answer! Snapping P2P channel...");
                            await engine.apply_answer(drop.sdp_answer.sdp);
                        }
                    } catch (err) {
                        console.error("Failed to parse dropped answer:", err);
                    }
                };

                hostWs.onerror = (e) => console.warn("Signaling socket error:", e);

                // Show copyable invite controls
                btnCreateRoom.classList.add("hidden");
                inviteInput.value = inviteUrl;
                inviteInput.classList.remove("hidden");
                btnCopyInvite.classList.remove("hidden");

                appendSystemMessage("Secure room created.");
            } catch (err) {
                console.error("Room creation failed:", err);
                alert("Room creation failed: " + err);
                if (inviteSection) inviteSection.classList.remove("hidden");
                btnCreateRoom.disabled = false;
                btnCreateRoom.textContent = "✨ Create Private Room";
                updateStatus("disconnected", "Error creating room");
            }
        }

        // =========================================================================
        // JOINER WORKFLOW: Detect #payload=..., generate answer, drop answer via POST
        // =========================================================================
        async function joinRoomFromHash(hashOrUrl) {
            if (isJoining) return;
            if (!hashOrUrl) return;

            try {
                let rawPayload = null;
                const match = hashOrUrl.match(/payload=([^&]+)/);
                if (match) {
                    rawPayload = match[1];
                } else if (!hashOrUrl.includes("=") && hashOrUrl.length > 50) {
                    rawPayload = hashOrUrl.trim().replace(/^#/, "");
                }

                if (!rawPayload) return;

                isJoining = true;
                isBurned = false;
                joinerBanner.classList.remove("hidden");
                joinerStatusText.textContent = "Found Room Invite! Accepting offer and generating answer...";
                updateStatus("signaling", "Connecting as peer...");

                if (inviteSection) inviteSection.classList.add("hidden");
                btnCreateRoom.classList.add("hidden");

                const jsonStr = base64UrlToUtf8(rawPayload);
                const invite = JSON.parse(jsonStr);

                engine = new ZeroWebRtcEngine();
                initEngineListeners();

                const answerSdp = await engine.accept_offer_and_create_answer(invite.sdp_offer.sdp);

                joinerStatusText.textContent = "Dispatching dead-drop answer to Cloudflare edge...";

                const dropPayload = {
                    invite_uuid: invite.invite_uuid,
                    token: invite.token,
                    sdp_answer: { sdp: answerSdp },
                    joiner_public_key: Array.from(crypto.getRandomValues(new Uint8Array(32)))
                };

                const dropUrl = `${WORKER_ORIGIN}/drop/${invite.do_id}/${invite.invite_uuid}`;
                const resp = await fetch(dropUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${invite.token}`
                    },
                    body: JSON.stringify(dropPayload)
                });

                if (!resp.ok) {
                    throw new Error(`Dead-drop rejected with HTTP ${resp.status}`);
                }

                joinerStatusText.textContent = "Answer delivered! Establishing direct P2P connection...";

                // Strip hash from URL for privacy and zero forensic trace
                history.replaceState(null, "", window.location.pathname);
            } catch (err) {
                isJoining = false;
                console.error("Joiner failed:", err);
                joinerStatusText.textContent = "Connection error: " + err.message;
                updateStatus("disconnected", "Join failed");
            }
        }

        // Event bindings
        btnCreateRoom.addEventListener("click", createRoomAsHost);

        btnCopyInvite.addEventListener("click", async () => {
            await navigator.clipboard.writeText(inviteInput.value);
            btnCopyInvite.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>`;
            setTimeout(() => {
                btnCopyInvite.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>`;
            }, 1500);
        });

        function doSendMessage() {
            if (!msgInput.value.trim() || !engine) return;
            const text = msgInput.value.trim();
            msgInput.value = "";
            try {
                engine.send_text(text);
                appendMessageBubble("You", text, true);
            } catch (e) {
                console.error("Send error:", e);
            }
        }

        sendBtn.addEventListener("click", doSendMessage);
        msgInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") doSendMessage();
        });

        burnBtn.addEventListener("click", () => {
            isBurned = true;
            if (engine) engine.close();
            if (hostWs) hostWs.close();
            isJoining = false;
            feed.innerHTML = `
                <div class="security-alert-card" style="border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.08);">
                    <span class="alert-icon" style="color: var(--accent-rose);">🔥 [SESSION BURNED]</span>
                    <span class="alert-message">All ephemeral DOM elements, keys, and session memory have been completely wiped.</span>
                </div>`;
            updateStatus("disconnected", "Destroyed");
            peerCountEl.textContent = "0 peers";
            peerListEl.innerHTML = "";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            if (inviteSection) inviteSection.classList.remove("hidden");
            btnCreateRoom.classList.remove("hidden");
            btnCreateRoom.disabled = false;
            btnCreateRoom.textContent = "✨ Create Private Room";
            inviteInput.classList.add("hidden");
            btnCopyInvite.classList.add("hidden");
            btnCopyInvite.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>`;
            history.replaceState(null, "", window.location.pathname);
        });

        // 1. Auto-detect invite hash on initial page load (e.g. opening link in new tab)
        if (window.location.hash && window.location.hash.includes("payload=")) {
            joinRoomFromHash(window.location.hash);
        }

        // 2. Auto-detect invite hash if user pastes URL into address bar of already-opened window
        window.addEventListener("hashchange", () => {
            if (window.location.hash && window.location.hash.includes("payload=")) {
                joinRoomFromHash(window.location.hash);
            }
        });
    </script>
</body>
</html>
