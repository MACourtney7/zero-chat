    <script type="module">
        const WORKER_ORIGIN = "https://network.zero-chat.workers.dev";
        const WORKER_WS_ORIGIN = "wss://network.zero-chat.workers.dev";

        const CREATE_ROOM_ICON_HTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <line x1="12" y1="8" x2="12" y2="14"></line>
                <line x1="9" y1="11" x2="15" y2="11"></line>
            </svg>`;

        // DOM elements
        const inviteBar = document.getElementById("invite-bar");
        const statusBadge = document.getElementById("status-badge");
        const statusBadgeText = document.getElementById("status-badge-text");
        const peerCountEl = document.getElementById("peer-count");
        const peerListEl = document.getElementById("peer-list");
        const headerLeaveBtn = document.getElementById("header-leave-btn");
        const createRoomBar = document.getElementById("create-room-bar");
        const btnCreateRoom = document.getElementById("btn-create-room");
        const inviteInput = document.getElementById("invite-url-input");
        const btnCopyInvite = document.getElementById("copy-invite-button");
        const joinerBanner = document.getElementById("joiner-banner");
        const joinerStatusText = document.getElementById("joiner-status-text");
        const feed = document.getElementById("messages-container");
        const messageForm = document.getElementById("message-form");
        const msgInput = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-button");
        const burnRoomBar = document.getElementById("burn-room-bar");
        const burnBtn = document.getElementById("destroy-session-button");

        // WebRTC Engine (Browser native WebRTC with bundled candidate gathering)
        class ZeroWebRtcEngine {
            constructor() {
                const rtcConfig = {
                    iceServers: [
                        { urls: "stun:stun.cloudflare.com:3478" },
                        { urls: "stun:stun.l.google.com:19302" }
                    ]
                };
                this.pc = new RTCPeerConnection(rtcConfig);
                this.dc = null;
                this.state = "disconnected";
                this.onStateChangeCb = null;
                this.onMessageCb = null;

                this.pc.ondatachannel = (ev) => {
                    this._attachChannel(ev.channel);
                };
            }

            _setState(s) {
                if (this.state === s) return;
                this.state = s;
                if (this.onStateChangeCb) this.onStateChangeCb(s);
            }

            _attachChannel(ch) {
                this.dc = ch;
                ch.onopen = () => this._setState("open");
                ch.onclose = () => this._setState("closed");
                ch.onerror = () => this._setState("closed");
                ch.onmessage = (ev) => {
                    if (this.onMessageCb) this.onMessageCb(ev.data);
                };
            }

            _waitForIceGatheringComplete() {
                if (this.pc.iceGatheringState === "complete") return Promise.resolve();
                return new Promise((resolve) => {
                    const check = () => {
                        if (this.pc.iceGatheringState === "complete") {
                            this.pc.removeEventListener("icegatheringstatechange", check);
                            resolve();
                        }
                    };
                    this.pc.addEventListener("icegatheringstatechange", check);
                    this.pc.addEventListener("icecandidate", (ev) => {
                        if (ev.candidate === null) {
                            this.pc.removeEventListener("icegatheringstatechange", check);
                            resolve();
                        }
                    });
                    setTimeout(resolve, 3000); // 3s fallback limit
                });
            }

            async create_offer() {
                const ch = this.pc.createDataChannel("zero-chat", { ordered: true });
                this._attachChannel(ch);
                this._setState("connecting");
                const offer = await this.pc.createOffer();
                await this.pc.setLocalDescription(offer);
                await this._waitForIceGatheringComplete();
                return this.pc.localDescription.sdp;
            }

            async accept_offer_and_create_answer(offerSdp) {
                this._setState("connecting");
                await this.pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: offerSdp }));
                const answer = await this.pc.createAnswer();
                await this.pc.setLocalDescription(answer);
                await this._waitForIceGatheringComplete();
                return this.pc.localDescription.sdp;
            }

            async apply_answer(answerSdp) {
                await this.pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: answerSdp }));
            }

            send_text(text) {
                if (!this.dc || this.dc.readyState !== "open") {
                    throw new Error("P2P DataChannel not open");
                }
                this.dc.send(text);
            }

            close() {
                if (this.dc) this.dc.close();
                this.pc.close();
                this._setState("closed");
            }
        }

        // URL-Safe Base64
        function utf8ToBase64Url(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        function base64UrlToUtf8(str) {
            let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4) b64 += "=";
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        async function computeHmacSha256Hex(secretBytes, messageStr) {
            const key = await crypto.subtle.importKey(
                "raw",
                secretBytes,
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );
            const signature = await crypto.subtle.sign(
                "HMAC",
                key,
                new TextEncoder().encode(messageStr)
            );
            return Array.from(new Uint8Array(signature))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function updateStatus(status, text) {
            console.debug(`[Status] ${status}: ${text}`);
            if (statusBadgeText) statusBadgeText.textContent = text;
        }

        const WELCOME_SPLASH_HTML = `
            <div id="welcome-splash" class="welcome-splash">
                <div class="welcome-features">
                    <div class="feature-card">
                        <div class="feature-icon">⚡</div>
                        <div class="feature-content">
                            <span class="feature-title">Direct P2P Connection</span>
                            <p class="feature-desc">Zero intermediate relays or storage servers.</p>
                        </div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">🔒</div>
                        <div class="feature-content">
                            <span class="feature-title">Secure Communications</span>
                            <p class="feature-desc">All messages are end-to-end encrypted.</p>
                        </div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">🛡️</div>
                        <div class="feature-content">
                            <span class="feature-title">Zero Trace</span>
                            <p class="feature-desc">Ephemeral chats that burn when closed.</p>
                        </div>
                    </div>
                </div>
            </div>`;

        function hideWelcomeSplash() {
            const splash = document.getElementById("welcome-splash");
            if (splash) {
                splash.classList.add("hidden");
            }
        }

        function showWelcomeSplash() {
            if (feed.querySelectorAll(".message-bubble, .system-message, .security-alert-card").length > 0) {
                return;
            }
            const splash = document.getElementById("welcome-splash");
            if (splash) {
                splash.classList.remove("hidden");
            } else {
                feed.insertAdjacentHTML("afterbegin", WELCOME_SPLASH_HTML);
            }
        }

        const PEER_COLOR_PALETTE = [
            "#38bdf8", // cyan
            "#fbbf24", // amber
            "#a855f7", // purple
            "#34d399", // emerald
            "#f43f5e", // rose
            "#818cf8"  // indigo
        ];
        const peerColorMap = new Map();

        function getPeerColor(peerId = "peer-01") {
            if (!peerColorMap.has(peerId)) {
                const color = PEER_COLOR_PALETTE[peerColorMap.size % PEER_COLOR_PALETTE.length];
                peerColorMap.set(peerId, color);
            }
            return peerColorMap.get(peerId);
        }

        function appendMessageBubble(senderName, text, isSelf, peerId) {
            hideWelcomeSplash();
            const bubble = document.createElement("div");
            bubble.className = `message-bubble ${isSelf ? "message-outgoing" : "message-incoming"}`;

            const header = document.createElement("div");
            header.className = "message-header";

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const time = document.createElement("span");
            time.className = "message-timestamp";
            time.textContent = timeStr;

            if (!isSelf) {
                const peerColor = getPeerColor(peerId || senderName || "peer-01");
                bubble.style.setProperty("--peer-color", peerColor);

                const peerDot = document.createElement("span");
                peerDot.className = "peer-dot";
                peerDot.style.backgroundColor = peerColor;
                header.appendChild(peerDot);
            } else {
                const selfDot = document.createElement("span");
                selfDot.className = "peer-dot self-dot";
                header.appendChild(selfDot);
            }

            header.appendChild(time);

            const body = document.createElement("div");
            body.className = "message-text";
            body.textContent = text;

            bubble.appendChild(header);
            bubble.appendChild(body);

            feed.appendChild(bubble);
            feed.scrollTop = feed.scrollHeight;
        }

        function appendSystemMessage(text) {
            hideWelcomeSplash();
            const el = document.createElement("div");
            el.className = "system-message";

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const timeSpan = document.createElement("span");
            timeSpan.className = "system-timestamp";
            timeSpan.textContent = timeStr;
            el.appendChild(timeSpan);

            const textSpan = document.createElement("span");
            textSpan.className = "system-text";
            textSpan.textContent = text;
            el.appendChild(textSpan);

            feed.appendChild(el);
            feed.scrollTop = feed.scrollHeight;
        }

        let engine = null;
        let hostWs = null;
        let isJoining = false;
        let isBurned = false;
        let hasActiveSession = false;

        function initEngineListeners() {
            engine.onStateChangeCb = (st) => {
                if (st === "open") {
                    hasActiveSession = true;
                    hideWelcomeSplash();
                    updateStatus("open", "P2P Established");
                    if (statusBadge) statusBadge.classList.add("hidden");
                    if (peerCountEl) {
                        peerCountEl.textContent = "1";
                    }
                    if (peerListEl) {
                        peerListEl.classList.remove("hidden");
                        peerListEl.innerHTML = `<span class="peer-pill"><svg class="peer-lock-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>`;
                    }
                    if (headerLeaveBtn) headerLeaveBtn.classList.remove("hidden");
                    if (burnRoomBar) burnRoomBar.classList.remove("hidden");
                    if (createRoomBar) createRoomBar.classList.add("hidden");
                    if (inviteBar) inviteBar.classList.add("hidden");
                    if (messageForm) messageForm.classList.remove("hidden");
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                    msgInput.focus();

                    // Sever host WebSocket edge immediately upon DataChannel open (REQ-004.5)
                    if (hostWs) {
                        try { hostWs.close(); } catch (_) {}
                        hostWs = null;
                    }
                    if (joinerBanner) joinerBanner.classList.add("hidden");

                    if (isJoining) {
                        appendSystemMessage("Joined chat");
                    } else {
                        appendSystemMessage("Peer joined chat");
                    }
                } else if (st === "closed") {
                    updateStatus("closed", "Disconnected");
                    if (statusBadge) {
                        statusBadge.classList.remove("hidden");
                        statusBadge.className = "status-pill status-disconnected";
                        if (statusBadgeText) statusBadgeText.textContent = "Disconnected";
                    }
                    if (peerCountEl) {
                        peerCountEl.textContent = "0";
                    }
                    if (peerListEl) {
                        peerListEl.classList.add("hidden");
                        peerListEl.innerHTML = "";
                    }
                    if (headerLeaveBtn) headerLeaveBtn.classList.add("hidden");
                    if (burnRoomBar) burnRoomBar.classList.add("hidden");
                    if (messageForm) messageForm.classList.add("hidden");
                    if (inviteBar) inviteBar.classList.add("hidden");
                    if (createRoomBar) {
                        createRoomBar.classList.remove("hidden");
                        btnCreateRoom.disabled = false;
                        btnCreateRoom.innerHTML = CREATE_ROOM_ICON_HTML;
                    }
                    msgInput.disabled = true;
                    sendBtn.disabled = true;
                    if (hasActiveSession && !isBurned) {
                        appendSystemMessage("Peer left chat");
                    }
                    hasActiveSession = false;
                    if (!isBurned) {
                        showWelcomeSplash();
                    }
                }
            };

            engine.onMessageCb = (text) => {
                appendMessageBubble("Peer", text, false, "peer-01");
            };
        }

        // =========================================================================
        // HOST WORKFLOW: Create room, offer, signaling websocket, and invite link
        // =========================================================================
        async function createRoomAsHost() {
            isBurned = false;
            isJoining = false;
            hideWelcomeSplash();
            btnCreateRoom.disabled = true;
            updateStatus("signaling", "Gathering ICE & creating offer...");

            try {
                engine = new ZeroWebRtcEngine();
                initEngineListeners();

                const offerSdp = await engine.create_offer();

                // Generate random room DO ID and 32-byte host secret
                const doId = "room-" + Math.random().toString(36).slice(2, 10);
                const hostSecretBytes = crypto.getRandomValues(new Uint8Array(32));
                const hostSecretHex = Array.from(hostSecretBytes).map(b => b.toString(16).padStart(2, "0")).join("");

                const inviteUuid = crypto.randomUUID();
                const tokenHex = await computeHmacSha256Hex(hostSecretBytes, inviteUuid);

                const hostPubkey = Array.from(crypto.getRandomValues(new Uint8Array(32)));

                const invitePayload = {
                    do_id: doId,
                    invite_uuid: inviteUuid,
                    token: tokenHex,
                    sdp_offer: { sdp: offerSdp },
                    host_public_key: hostPubkey,
                    guest_private_key: null
                };

                const packedHash = "#payload=" + utf8ToBase64Url(JSON.stringify(invitePayload));
                const inviteUrl = window.location.origin + window.location.pathname + packedHash;

                // Connect host signaling WebSocket
                updateStatus("signaling", "Awaiting peer connection...");
                const wsUrl = `${WORKER_WS_ORIGIN}/host/${doId}?secret=${hostSecretHex}`;
                hostWs = new WebSocket(wsUrl);

                hostWs.onmessage = async (ev) => {
                    try {
                        const drop = JSON.parse(ev.data);
                        if (drop && drop.sdp_answer && drop.sdp_answer.sdp) {
                            updateStatus("connecting", "Received answer! Snapping P2P channel...");
                            await engine.apply_answer(drop.sdp_answer.sdp);
                        }
                    } catch (err) {
                        console.error("Failed to parse dropped answer:", err);
                    }
                };

                hostWs.onerror = (e) => console.warn("Signaling socket error:", e);

                // Show copyable invite controls in footer action slot (replacing create-room-bar)
                if (createRoomBar) createRoomBar.classList.add("hidden");
                if (inviteBar) inviteBar.classList.remove("hidden");
                inviteInput.value = inviteUrl;

                appendSystemMessage("Secure chat created");
            } catch (err) {
                console.error("Chat creation failed:", err);
                alert("Chat creation failed: " + err);
                if (inviteBar) inviteBar.classList.add("hidden");
                if (createRoomBar) {
                    createRoomBar.classList.remove("hidden");
                    btnCreateRoom.disabled = false;
                    btnCreateRoom.innerHTML = CREATE_ROOM_ICON_HTML;
                }
                updateStatus("disconnected", "Error creating chat");
            }
        }

        // =========================================================================
        // JOINER WORKFLOW: Detect #payload=..., generate answer, drop answer via POST
        // =========================================================================
        async function joinRoomFromHash(hashOrUrl) {
            if (isJoining) return;
            if (!hashOrUrl) return;

            try {
                let rawPayload = null;
                const match = hashOrUrl.match(/payload=([^&]+)/);
                if (match) {
                    rawPayload = match[1];
                } else if (!hashOrUrl.includes("=") && hashOrUrl.length > 50) {
                    rawPayload = hashOrUrl.trim().replace(/^#/, "");
                }

                if (!rawPayload) return;

                isJoining = true;
                isBurned = false;
                joinerBanner.classList.remove("hidden");
                joinerStatusText.textContent = "Found Chat Invite! Accepting offer and generating answer...";
                updateStatus("signaling", "Connecting as peer...");

                if (inviteBar) inviteBar.classList.add("hidden");
                if (createRoomBar) createRoomBar.classList.add("hidden");

                const jsonStr = base64UrlToUtf8(rawPayload);
                const invite = JSON.parse(jsonStr);

                engine = new ZeroWebRtcEngine();
                initEngineListeners();

                const answerSdp = await engine.accept_offer_and_create_answer(invite.sdp_offer.sdp);

                joinerStatusText.textContent = "Dispatching dead-drop answer to Cloudflare edge...";

                const dropPayload = {
                    invite_uuid: invite.invite_uuid,
                    token: invite.token,
                    sdp_answer: { sdp: answerSdp },
                    joiner_public_key: Array.from(crypto.getRandomValues(new Uint8Array(32)))
                };

                const dropUrl = `${WORKER_ORIGIN}/drop/${invite.do_id}/${invite.invite_uuid}`;
                const resp = await fetch(dropUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${invite.token}`
                    },
                    body: JSON.stringify(dropPayload)
                });

                if (!resp.ok) {
                    throw new Error(`Dead-drop rejected with HTTP ${resp.status}`);
                }

                joinerStatusText.textContent = "Answer delivered! Establishing direct P2P connection...";

                // Strip hash from URL for privacy and zero forensic trace
                history.replaceState(null, "", window.location.pathname);
            } catch (err) {
                isJoining = false;
                console.error("Joiner failed:", err);
                joinerStatusText.textContent = "Connection error: " + err.message;
                updateStatus("disconnected", "Join failed");
            }
        }

        // Event bindings
        btnCreateRoom.addEventListener("click", createRoomAsHost);

        btnCopyInvite.addEventListener("click", async () => {
            await navigator.clipboard.writeText(inviteInput.value);
            btnCopyInvite.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>`;
            setTimeout(() => {
                btnCopyInvite.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>`;
            }, 1500);
        });

        function doSendMessage() {
            if (!msgInput.value.trim() || !engine) return;
            const text = msgInput.value.trim();
            msgInput.value = "";
            try {
                engine.send_text(text);
                appendMessageBubble("You", text, true);
            } catch (e) {
                console.error("Send error:", e);
            }
        }

        sendBtn.addEventListener("click", doSendMessage);
        msgInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") doSendMessage();
        });

        function resetToHome() {
            hasActiveSession = false;
            isBurned = false;
            isJoining = false;
            peerColorMap.clear();
            if (engine) {
                engine.onStateChangeCb = null;
                engine.close();
                engine = null;
            }
            if (hostWs) {
                try { hostWs.close(); } catch (_) {}
                hostWs = null;
            }
            feed.innerHTML = "";
            showWelcomeSplash();
            updateStatus("disconnected", "Disconnected");
            if (statusBadge) {
                statusBadge.classList.remove("hidden");
                statusBadge.className = "status-pill status-disconnected";
                if (statusBadgeText) statusBadgeText.textContent = "Disconnected";
            }
            if (peerCountEl) {
                peerCountEl.textContent = "0";
            }
            if (peerListEl) {
                peerListEl.classList.add("hidden");
                peerListEl.innerHTML = "";
            }
            if (headerLeaveBtn) headerLeaveBtn.classList.add("hidden");
            if (burnRoomBar) burnRoomBar.classList.add("hidden");
            if (messageForm) messageForm.classList.add("hidden");
            if (inviteBar) inviteBar.classList.add("hidden");
            if (joinerBanner) joinerBanner.classList.add("hidden");
            if (createRoomBar) {
                createRoomBar.classList.remove("hidden");
                btnCreateRoom.disabled = false;
                btnCreateRoom.innerHTML = CREATE_ROOM_ICON_HTML;
            }
            msgInput.disabled = true;
            sendBtn.disabled = true;
            history.replaceState(null, "", window.location.pathname);
        }

        if (headerLeaveBtn) {
            headerLeaveBtn.addEventListener("click", resetToHome);
        }

        burnBtn.addEventListener("click", resetToHome);

        // 1. Auto-detect invite hash on initial page load (e.g. opening link in new tab)
        if (window.location.hash && window.location.hash.includes("payload=")) {
            joinRoomFromHash(window.location.hash);
        }

        // 2. Auto-detect invite hash if user pastes URL into address bar of already-opened window
        window.addEventListener("hashchange", () => {
            if (window.location.hash && window.location.hash.includes("payload=")) {
                joinRoomFromHash(window.location.hash);
            }
        });
    </script>
</body>
</html>
